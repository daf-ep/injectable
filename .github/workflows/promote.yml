name: promote

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the repository owner
        run: |
          set -eu
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "::error::${{ github.actor }} is not ${{ github.repository_owner }}; only the repository owner can run this promotion."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open the dev-to-main pull request, wait for its checks, merge
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: bash tool/promote.sh
